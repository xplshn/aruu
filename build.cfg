BUILD_POSIX=0; BUILD_XSI=0; BUILD_PSEUDO=0; BUILD_NET=0; BUILD_LINUX=0; BUILD_EXTRA=0; BUILD_DEV=0
for _p in $PRESET_UTILS; do
    case "$_p" in
        posix)  BUILD_POSIX=1  ;;
        linux)  BUILD_LINUX=1  ;;
        net)    BUILD_NET=1    ;;
        xsi)    BUILD_XSI=1    ;;
        pseudo) BUILD_PSEUDO=1 ;;
        extra)  BUILD_EXTRA=1  ;;
        dev)    BUILD_DEV=1    ;;
        *)
            printf 'build.cfg: unknown util preset: %s\n' "$_p" >&2
            return 1 2>/dev/null || exit 1
            ;;
    esac
done
unset _p

# --- per-item overrides (after preset expansion) ---
# BUILD_POSIX_SH=0       # disable a tool when its group is active
# BUILD_DEV_AS=1         # enable a tool whose group isnt in PRESET_UTILS
FEATURE_SH_HISTEDIT=1

# FEATURE_INPROC_EXEC: when set to 1, wexecvp/wexecv/wpopen/wsystem call
# registered tool mains directly instead of fork+exec. this is only meaningful
# inside aruu-box, where every tool has registered its main at startup
#
# the analogy is busybox: a single binary where sh can call grep, sed, awk, etc.
# without spawning a new process for each one. scripts run faster and the whole
# system needs no external PATH at all. aruu-box built with this flag is fully
# self-contained, exactly like a busybox applet collection
#
# this is optional. set to 0 to build the box without inproc dispatch (each
# tool call still fork+execs). for individual standalone tool binaries this
# flag has no practical effect because no other mains are registered
#
FEATURE_INPROC_EXEC=0
#
# FEATURE_INPROC_EXEC_OVERRIDE: only meaningful when FEATURE_INPROC_EXEC=1
# when set to 1, ARUU_INPROC_EXEC=0 in the environment forces fork+exec at
# runtime, letting a person reach an external tool that shares a name with
# a builtin without giving its full path. when set to 0, that env var is
# never read at all and inproc dispatch cannot be bypassed except by a tool
# explicitly calling wexec_set_inproc()
#
FEATURE_INPROC_EXEC_OVERRIDE=0
#

# tls backend: set exactly one to 1 to enable tls
#
FEATURE_USE_BEARSSL=0
FEATURE_USE_LIBRESSL=0
FEATURE_USE_OPENSSL=0
FEATURE_USE_SSL=1
#
if [ "$FEATURE_USE_SSL" = 1 ]; then
    if [ "$FEATURE_USE_BEARSSL" = 0 ] && [ "$FEATURE_USE_LIBRESSL" = 0 ] && [ "$FEATURE_USE_OPENSSL" = 0 ]; then
        if pkg-config --exists libbearssl 2>/dev/null || pkg-config --exists bearssl 2>/dev/null; then
            FEATURE_USE_BEARSSL=1
        elif pkg-config --exists libtls 2>/dev/null; then
            FEATURE_USE_LIBRESSL=1
        elif pkg-config --exists openssl 2>/dev/null; then
            FEATURE_USE_OPENSSL=1
        fi
    fi
fi
# auto-detect TLS/SSL flags based on selected backend
CPPFLAGS_TLS="" LDFLAGS_TLS="" LDLIBS_TLS="" PKG_NAME=""
if [ "$FEATURE_USE_BEARSSL" = 1 ]; then
    if pkg-config --exists libbearssl 2>/dev/null; then
        PKG_NAME="libbearssl"
    elif pkg-config --exists bearssl 2>/dev/null; then
        PKG_NAME="bearssl"
    fi
elif [ "$FEATURE_USE_LIBRESSL" = 1 ]; then
    if pkg-config --exists libtls 2>/dev/null; then
        PKG_NAME="libtls"
    else
        LDLIBS_TLS="-ltls"
    fi
elif [ "$FEATURE_USE_OPENSSL" = 1 ]; then
    if pkg-config --exists openssl 2>/dev/null; then
        PKG_NAME="openssl"
    else
        LDLIBS_TLS="-lssl -lcrypto"
    fi
fi
if [ -n "$PKG_NAME" ]; then
    CPPFLAGS_TLS="$(pkg-config --cflags "$PKG_NAME")"
    LDLIBS_TLS="$(pkg-config --libs "$PKG_NAME")"
fi
# trim whitespace
CPPFLAGS_TLS=$(echo "$CPPFLAGS_TLS" | xargs)
LDFLAGS_TLS=$(echo "$LDFLAGS_TLS" | xargs)
LDLIBS_TLS=$(echo "$LDLIBS_TLS" | xargs)
